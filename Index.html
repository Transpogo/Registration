<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TranspoGO – Trucks, Vehicles & Transport Contracts in India</title>
<meta name="description" content="Find trucks, pickups, LCV and HCV vehicles for contract or on-demand transport. Search by city, area or PIN code and send a booking request to TranspoGO.">
<meta name="robots" content="index,follow"><meta property="og:title" content="TranspoGO – Transport Marketplace"><meta property="og:type" content="website">
<style>
:root{--o:#ff4a05;--g:#0f5132;--t:#222;--bg:#f6f6f4;--ln:#e3e3df;--pk:#fff1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root{color-scheme:light}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.logo{font-weight:900;font-size:22px;color:var(--o);letter-spacing:.5px;display:flex;align-items:center;gap:6px;text-decoration:none}
.logo img{height:40px;width:auto;display:block}
.ib{background:none;border:0;min-width:44px;min-height:44px;cursor:pointer;color:var(--o)}
main{max-width:1200px;margin:0 auto;padding:10px 12px}
.demo{background:#fff8e1;border:1px solid #f0d98a;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:10px}
.search{width:100%;min-height:48px;border:2px solid var(--ln);border-radius:10px;padding:0 14px;background:#fff}
.search:focus{border-color:var(--o);outline:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tabs button{min-height:46px;border-radius:10px;border:0;font-weight:600;font-size:16px;cursor:pointer;background:#ececea;color:#444}
.tabs .on{background:var(--o);color:#fff}
.note{font-size:14px;margin:4px 2px 10px;color:#555}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:8px;display:flex;flex-direction:column;min-width:0}
.gw{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1/.8;background:#ddd}

.gal{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:0 0 100%;height:100%;width:100%;display:block;scroll-snap-align:start}
.dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6)}
.dots i.on{background:var(--o)}
.card h3{font-size:15px;margin:8px 2px 2px;line-height:1.25}
.loc{font-size:13px;color:#555;margin:0 2px}
.meta{font-size:12px;color:var(--g);font-weight:600;margin:4px 2px}
.price{background:var(--pk);border-radius:8px;padding:6px 8px;color:var(--o);font-weight:700;margin:4px 0 8px}
.price small{color:#8a3a14;font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.b{min-height:44px;border-radius:8px;border:2px solid var(--o);background:#fff;color:var(--o);font-weight:600;cursor:pointer}
.b.p{background:var(--o);color:#fff}
.b:disabled{opacity:.45;cursor:not-allowed}
.empty{text-align:center;padding:40px 10px;color:#555}
footer{background:var(--g);color:#fff;position:fixed;left:0;right:0;bottom:0;height:calc(54px + env(safe-area-inset-bottom,0px));z-index:15;text-align:center;font-size:12px;padding-top:30px}
.fab{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:var(--o);border:5px solid #fff;color:#fff;font-size:42px;line-height:1;cursor:pointer;z-index:30;box-shadow:0 3px 8px rgba(0,0,0,.3)}
dialog{background:#fff;color:#222;border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 8px 30px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#fff;z-index:2}
.dh h2{font-size:18px;margin:0}
.db{padding:12px 16px 18px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
input,select,textarea{width:100%;min-height:44px;border:1px solid #999;border-radius:8px;padding:8px 10px;background:#fff;color:#222;-webkit-text-fill-color:#222;caret-color:var(--o)}
input::placeholder,textarea::placeholder{color:#777;-webkit-text-fill-color:#777}
select option{color:#222;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--o);outline:2px solid #ffd2bd}
label{color:#222}input[type=checkbox]{accent-color:var(--o)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#b00020;font-size:12px;min-height:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0}dt{color:#666}dd{margin:0;font-weight:600}
.ok{background:#e9f6ee;border:1px solid #9bd2b0;border-radius:8px;padding:12px}

 const f=st.f;let list=L.filter(l=>l.status=="active");
 const m=(k,v)=>String(l=>0);
 list=list.filter(l=>(!f.type||l.vehicleType==f.type)&&(!f.cat||l.vehicleCategory==f.cat)&&(!f.cap||String(l.capacity)==f.cap)&&(!f.wheels||String(l.wheels)==f.wheels)&&(!f.state||l.state==f.state)&&(!f.district||l.district==f.district)&&(!f.city||l.city==f.city)&&(!f.area||norm(l.area).includes(norm(f.area)))&&(!f.pin||l.pinCode.startsWith(f.pin))&&(!f.name||norm(l.vehicleName).includes(norm(f.name)))&&(f.avail!="Contract"||l.contract)&&(f.avail!="On Demand"||l.onDemand));
 const fixes={};let note="";
 if(st.q.trim()){const qt=toks(st.q);
  list=list.map(l=>({l,s:score(l,qt,fixes)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.l);
  const v=[...new Set(Object.values(fixes))];if(v.length&&list.length)note="Showing results for <b>"+esc(v.join(", "))+"</b>"}
 return{list,note}}

/* ---------- art ---------- */
function slide(l,i){const c=COL[l.col],bike=l.vehicleName.toLowerCase().includes("bike");
 const body=i==0?`<rect x="20" y="42" width="100" height="52" rx="3" fill="${c}" stroke="#555"/><path d="M122 56h30l16 18v20h-46z" fill="${c}" stroke="#555"/><path d="M130 60h20l10 13h-30z" fill="#9cc7e6"/><rect x="20" y="82" width="100" height="5" fill="#ff4a05"/>`:
 i==1?`<rect x="45" y="30" width="110" height="66" rx="3" fill="${c}" stroke="#555"/><path d="M100 30v66" stroke="#999"/><rect x="60" y="100" width="80" height="6" fill="#444"/>`:
 `<rect x="15" y="25" width="170" height="80" fill="#2b2b2b"/><rect x="30" y="35" width="140" height="60" fill="#555"/><path d="M30 35l15 12h110l15-12" stroke="#777" fill="none"/>`;
 const wh=i==2?"":`<circle cx="52" cy="98" r="12" fill="#222"/><circle cx="140" cy="98" r="12" fill="#222"/><circle cx="52" cy="98" r="5" fill="#bbb"/><circle cx="140" cy="98" r="5" fill="#bbb"/>`;
 return `<svg viewBox="0 0 200 140" role="img" aria-label="${esc(l.vehicleName)} available in ${esc(l.city)}, image ${i+1}" preserveAspectRatio="xMidYMid slice"><rect width="200" height="140" fill="${i==2?"#3a3a3a":"#dcebf5"}"/><rect y="108" width="200" height="32" fill="#9a9a90"/>${body}${wh}</svg>`}
function gallery(l){if(l.imgs&&l.imgs.length)return l.imgs.map((u,i)=>`<img src="${esc(u)}" alt="${esc(l.vehicleName)} available in ${esc(l.city)}, photo ${i+1}" loading="lazy" decoding="async" style="object-fit:cover">`).join("");return Array.from({length:l.images},(_,i)=>slide(l,i)).join("")}

/* ---------- render ---------- */
const price=l=>`₹${l.price}`;
function render(reset){if(reset)st.page=1;const{list,note}=run();$("#note").innerHTML=note||(list.length?list.length+" vehicles":"");
 const show=list.slice(0,st.page*st.PER);$("#empty").hidden=!!list.length;
 $("#grid").innerHTML=show.map(l=>`<article class="card"><div class="gw"><div class="gal" data-n="${l.images}" tabindex="0" aria-label="Photos of ${esc(l.vehicleName)}">${gallery(l)}</div><div class="dots">${Array.from({length:l.images},(_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div></div>
 <h3>${esc(l.vehicleName)}</h3><p class="loc">📍 ${esc(l.area)}, ${esc(l.city)}</p><p class="meta">${esc(l.vehicleType)} · ${l.capacity} Ton · ${l.wheels} Wheels</p><div class="price">${[l.contract&&"Contract",l.onDemand&&"On Demand"].filter(Boolean).join(" · ")}</div>
 <div class="btns"><button class="b" data-d="${l.listingId}">Details</button><button class="b p" data-b="${l.listingId}">Book</button></div></article>`).join("");
 $("#more").hidden=show.length>=list.length;
 const n=Object.values(st.f).filter(Boolean).length;$("#fc").textContent=n?`(${n})`:"";bind()}
function bind(){document.querySelectorAll(".gal").forEach(g=>{if(g._b)return;g._b=1;
 g.addEventListener("scroll",()=>{const i=Math.round(g.scrollLeft/g.clientWidth);g.nextElementSibling.querySelectorAll("i").forEach((d,k)=>d.classList.toggle("on",k==i))},{passive:true});
 ["pointerdown","wheel","touchstart"].forEach(e=>g.addEventListener(e,()=>g._p=Date.now()+8000,{passive:true}))})}
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
setInterval(()=>{if(reduce||document.hidden)return;document.querySelectorAll(".gal").forEach(g=>{
 const r=g.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight||r.width==0||(g._p&&g._p>Date.now()))return;
 const n=+g.dataset.n,i=Math.round(g.scrollLeft/g.clientWidth);g.scrollTo({left:((i+1)%n)*g.clientWidth,behavior:"smooth"})})},3200);

/* ---------- events ---------- */
let tm;$("#q").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=e.target.value;render(1)},200)});
$("#more").onclick=()=>{st.page++;render()};
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>b.closest("dialog").close());

$("#grid").addEventListener("click",e=>{const d=e.target.closest("[data-d]"),b=e.target.closest("[data-b]");if(d)details(d.dataset.d);if(b)booking(b.dataset.b)});

$("#tabC").dataset.t=1;

/* filters */
const uniq=(k,num)=>[...new Set(L.map(l=>l[k]))].sort(num?(a,b)=>a-b:undefined);
function fsel(id,lab,vals){return `<label for="f_${id}">${lab}</label><select id="f_${id}"><option value="">All</option>${vals.map(v=>`<option ${String(st.f[id])==String(v)?"selected":""}>${esc(v)}</option>`).join("")}</select>`}
$("#tabF").onclick=()=>{const f=st.f;$("#fb").innerHTML=`<label for="f_name">Vehicle Name</label><input id="f_name" value="${esc(f.name||"")}">`+fsel("type","Vehicle Type",uniq("vehicleType"))+fsel("cat","Vehicle Category",uniq("vehicleCategory"))+fsel("cap","Capacity / Tons",uniq("capacity",1))+fsel("wheels","Wheels",uniq("wheels",1))+fsel("state","State",uniq("state"))+fsel("district","District",uniq("district"))+fsel("city","City",uniq("city"))+`<label for="f_area">Area</label><input id="f_area" value="${esc(f.area||"")}"><label for="f_pin">PIN Code</label><input id="f_pin" inputmode="numeric" maxlength="6" value="${esc(f.pin||"")}">`+fsel("avail","Availability",["Contract","On Demand"])+`<div class="r2" style="margin-top:14px"><button class="b" id="fr">Reset</button><button class="b p" id="fa">Apply</button></div>`;
 $("#fr").onclick=()=>{st.f={};$("#dF").close();render(1)};
 $("#fa").onclick=()=>{st.f={};["name","type","cat","cap","wheels","state","district","city","area","pin","avail"].forEach(k=>{const v=$("#f_"+k).value.trim();if(v)st.f[k]=v});$("#dF").close();render(1)};$("#dF").showModal()};

const byId=id=>L.find(l=>l.listingId==id);
function details(id){const l=byId(id);$("#dbody").innerHTML=`<div class="gw" style="aspect-ratio:1/.7"><div class="gal" data-n="${l.images}">${gallery(l)}</div><div class="dots">${Array.from({length:l.images},(_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div></div>
<h3 style="margin:10px 0 0;font-size:20px">${esc(l.vehicleName)}</h3><p class="loc">Listing ID: <b>${l.listingId}</b></p>
<dl><dt>Type</dt><dd>${l.vehicleType}</dd><dt>Category</dt><dd>${l.vehicleCategory}</dd><dt>Capacity</dt><dd>${l.capacity} ${l.capacityUnit}</dd><dt>Wheels</dt><dd>${l.wheels}</dd><dt>State</dt><dd>${esc(l.state)}</dd><dt>District</dt><dd>${esc(l.district)}</dd><dt>City</dt><dd>${esc(l.city)}</dd><dt>Area</dt><dd>${esc(l.area)}</dd><dt>PIN Code</dt><dd>${l.pinCode}</dd><dt>Availability</dt><dd>${[l.contract&&"Contract",l.onDemand&&"On Demand"].filter(Boolean).join(", ")}</dd></dl>
<p>${esc(l.description)}</p><div class="r2"><button class="b" disabled title="Enquiries go through TranspoGO">Contact</button><button class="b p" id="db2">Book</button></div>`;
 $("#db2").onclick=()=>{$("#dD").close();booking(id)};bind();$("#dD").showModal()}

/* booking */
const fld=(id,lab,t="text",x="")=>`<label for="${id}">${lab}</label><input id="${id}" type="${t}" ${x}><div class="err" id="e_${id}"></div>`;
function booking(id){const l=byId(id);$("#bbody").innerHTML=`<div class="ok" style="background:var(--pk);border-color:#f5c3a8"><b>${esc(l.vehicleName)}</b> · ${l.listingId}<br>${l.vehicleType} · ${l.capacity} Ton · ${esc(l.area)}, ${esc(l.city)}</div>
<form id="bf" novalidate>${fld("cn","Customer name","text","required maxlength=80")}${fld("co","Company name","text","maxlength=80")}${fld("cp","Customer phone","tel","required inputmode=numeric maxlength=10")}
<label for="bt">Booking type</label><select id="bt">${[l.contract&&"Contract",l.onDemand&&"On Demand"].filter(Boolean).map(x=>`<option>${x}</option>`).join("")}</select>
<div class="note" id="bnote" aria-live="polite"></div><div class="r2"><div>${fld("fd","From date","date","required")}</div><div id="wft">${fld("ft","From time","time")}</div><div>${fld("td","To date","date","required")}</div><div id="wtt">${fld("tt","To time","time")}</div></div>${fld("qp","Your quotation / offered price (₹)","number","required min=1")}
${fld("pl","Pickup location","text","required maxlength=150")}${fld("pp","Pickup PIN Code","text","required inputmode=numeric maxlength=6")}${fld("dl","Drop location","text","required maxlength=150")}${fld("dp","Drop PIN Code","text","required inputmode=numeric maxlength=6")}
<label for="ar">Additional requirements</label><textarea id="ar" maxlength="500"></textarea>
<button class="b p" style="width:100%;margin-top:14px">Submit booking request</button></form>`;
 const sync=()=>{const od=$("#bt").value=="On Demand";["wft","wtt"].forEach(k=>$("#"+k).hidden=!od);["ft","tt"].forEach(k=>{$("#"+k).disabled=!od;if(!od)$("#"+k).value=""});$("#bnote").textContent=od?"On Demand: choose date and time.":"Contract: choose dates only (no time)."};$("#bt").onchange=sync;sync();
 $("#bf").onsubmit=async e=>{e.preventDefault();let ok=true;const set=(k,m)=>{$("#e_"+k).textContent=m||"";if(m)ok=false};
  const od=$("#bt").value=="On Demand";["cn","fd","td","pl","dl"].concat(od?["ft","tt"]:[]).forEach(k=>set(k,$("#"+k).value.trim()?"":"Required"));set("qp",+$("#qp").value>0?"":"Enter your quotation amount");
  set("cp",/^[6-9]\d{9}$/.test($("#cp").value)?"":"Enter a valid 10-digit mobile number");
  ["pp","dp"].forEach(k=>set(k,/^\d{6}$/.test($("#"+k).value)?"":"PIN must be exactly 6 digits"));
  if(ok&&$("#td").value+$("#tt").value<$("#fd").value+$("#ft").value)set("td","To must be after From");
  if(!ok)return;const v=k=>$("#"+k).value.trim(),btn=e.submitter;if(btn){btn.disabled=true;btn.textContent="Submitting…"}
  const res=await toSheets("booking",{listingId:l.listingId,customerName:v("cn"),company:v("co"),phone:v("cp"),bookingType:$("#bt").value,fromDate:v("fd"),fromTime:v("ft"),toDate:v("td"),toTime:v("tt"),pickup:v("pl"),pickupPin:v("pp"),drop:v("dl"),dropPin:v("dp"),quotation:v("qp"),notes:v("ar")});
  if(!res.ok&&!res.off){if(btn){btn.disabled=false;btn.textContent="Submit booking request"}$("#e_qp").textContent=res.error||"Could not submit. Please check your connection and try again.";return}
  let bid=res.id;if(!bid){const n=store.get("bkSeq",0)+1;store.set("bkSeq",n);bid="TG-BK-"+String(n).padStart(6,"0")}
  const msg=`NEW TRANSPOGO BOOKING\n\nBooking ID:\n${bid}\n\nListing ID:\n${l.listingId}\n\nVehicle:\n${l.vehicleName}\n\nVehicle Type:\n${l.vehicleType}\n\nCapacity:\n${l.capacity} ${l.capacityUnit}\n\nWheels:\n${l.wheels}\n\nVendor/Driver:\n${l.vendorName}\n\nLocation:\n${l.area}, ${l.city}, ${l.state}\n\nBooking Type:\n${$("#bt").value}\n\nFrom:\n${(v("fd")+" "+v("ft")).trim()}\n\nTo:\n${(v("td")+" "+v("tt")).trim()}\n\nCustomer:\n${v("cn")}\n\nCompany:\n${v("co")}\n\nCustomer Phone:\n${v("cp")}\n\nPickup:\n${v("pl")}\n\nPickup PIN:\n${v("pp")}\n\nDrop:\n${v("dl")}\n\nDrop PIN:\n${v("dp")}\n\nCustomer Quotation:\n₹${v("qp")}\n\nAdditional Requirements:\n${v("ar")}`;
  const list=store.get("bookings",[]);list.push({bid,listingId:l.listingId,status:"new"});store.set("bookings",list);
  $("#bbody").innerHTML=`<div class="ok"><h3 style="margin:0 0 6px">Booking request submitted successfully.</h3><p>Your TranspoGO team will contact you regarding confirmation.</p><p>Booking ID: <b>${bid}</b></p></div>
  <p style="font-size:13px;color:#555">${res.ok?(res.wa=="sent"?"Your request has been saved and sent to the TranspoGO team on WhatsApp. You can also message us directly:":"Your request has been saved with TranspoGO. You can also message us directly on WhatsApp:"):"Demo mode: the backend is not connected, so this request is stored only in this browser. You can send it to TranspoGO directly:"}</p>
  <a class="b p" style="display:flex;align-items:center;justify-content:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">Send on WhatsApp</a>`}
 $("#dB").showModal()}

 ${fld("pn","PIN Code","text","required inputmode=numeric maxlength=6")}

 <button class="b p" style="width:100%;margin-top:10px">Submit listing</button></form>`;
 $("#af").onsubmit=async e=>{e.preventDefault();let ok=true;const set=(k,m)=>{$("#e_"+k).textContent=m||"";if(m)ok=false},V=k=>$("#"+k).value.trim();

  set("pn",/^\d{6}$/.test(V("pn"))?"":"PIN must be exactly 6 digits");set("vp",/^[6-9]\d{9}$/.test(V("vp"))?"":"Enter a valid 10-digit mobile number");

  const city=V("ci"),key=toks(city).join(" "),code=CODES[key]||(key.replace(/[^a-z]/g,"").slice(0,3).toUpperCase()||"XXX"),d=new Date(),mm=String(d.getMonth()+1).padStart(2,"0"),yy=String(d.getFullYear()).slice(2),sk=`seq-${code}-${mm}-${yy}`;

$("#add").onclick=()=>{addForm();$("#dA").showModal()};
if(SHEETS_URL){$(".demo").hidden=true;L=[];render();fetch(SHEETS_URL+"?action=listings").then(r=>r.json()).then(d=>{L=(d.listings||[]).map(x=>({...x,col:0,images:(x.imgs&&x.imgs.length)||3,status:"active"}));render(1)}).catch(()=>{})}else render();
